<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nevo</title>
    <meta http-equiv="refresh" content="0; url=http://localhost:3000" />
    <style>
      :root {
        --bg: #fffafc;
        --text: #2f1d36;
        --muted: #6a5972;
        --accent: #7b5ca8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fffafc 0%, #f6ecff 100%);
        color: var(--text);
      }
      .card {
        text-align: center;
        padding: 3rem 2.5rem;
        border-radius: 24px;
        background: rgba(255,255,255,0.8);
        border: 1px solid #eedaf1;
        box-shadow: 0 18px 50px rgba(120, 92, 160, 0.12);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.06em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Nevo</h1>
      <p>Redirecting to the local app preview at <a href="http://localhost:3000">http://localhost:3000</a></p>
    </div>
  </body>
</html>
